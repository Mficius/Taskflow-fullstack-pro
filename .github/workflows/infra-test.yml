name: Infra tests (terraform test + LocalStack)

# Teste l'infrastructure SANS toucher un vrai compte AWS :
#   1. unit        : `terraform test` avec providers simulés (mock_provider) + tests des politiques OPA — toujours exécuté
#   2. localstack  : apply réel sur LocalStack puis destroy — exécuté si le secret LOCALSTACK_AUTH_TOKEN existe
#                    (ECS, RDS, ELBv2, ECR sont des services de l'édition payante/essai de LocalStack)
on:
  push:
    branches: ["**"]
    paths: ["infrastructure/**", ".github/workflows/infra-test.yml"]
  pull_request:
    paths: ["infrastructure/**"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: infra-test-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.10.5"

jobs:
  unit:
    name: terraform test (mock) + OPA
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: infrastructure/terraform }
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - run: terraform fmt -check -recursive -diff
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - name: Tests unitaires (mock_provider — aucun compte AWS)
        run: terraform test
      - name: Tests des politiques OPA
        run: |
          tmp="$(mktemp -d)"
          curl -fsSL "https://github.com/open-policy-agent/conftest/releases/download/v0.56.0/conftest_0.56.0_Linux_x86_64.tar.gz" | tar -xz -C "$tmp" conftest
          "$tmp/conftest" verify -p ../policy

  localstack:
    name: LocalStack (apply réel simulé)
    runs-on: ubuntu-latest
    needs: unit
    env:
      LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: LocalStack ignoré (LOCALSTACK_AUTH_TOKEN absent)
        if: env.LOCALSTACK_AUTH_TOKEN == ''
        run: echo "::notice::Ajoutez le secret LOCALSTACK_AUTH_TOKEN pour appliquer l'infra complète (ECS/RDS/ELB) sur LocalStack."

      - name: Démarrer LocalStack
        if: env.LOCALSTACK_AUTH_TOKEN != ''
        run: docker compose -f infrastructure/localstack/docker-compose.yml up -d --wait

      - uses: hashicorp/setup-terraform@v3
        if: env.LOCALSTACK_AUTH_TOKEN != ''
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Apply + tests d'intégration + destroy sur LocalStack
        if: env.LOCALSTACK_AUTH_TOKEN != ''
        run: ./infrastructure/localstack/run-tests.sh

      - name: Logs LocalStack en cas d'échec
        if: failure() && env.LOCALSTACK_AUTH_TOKEN != ''
        run: docker compose -f infrastructure/localstack/docker-compose.yml logs --tail=200

      - name: Arrêt de LocalStack
        if: always() && env.LOCALSTACK_AUTH_TOKEN != ''
        run: docker compose -f infrastructure/localstack/docker-compose.yml down -v