apiVersion: v1
kind: ConfigMap
metadata:
  name: taskflow-api-config
  namespace: taskflow
  labels: {app.kubernetes.io/name: taskflow-api, app.kubernetes.io/part-of: taskflow}
data:
  APP_NAME: TaskFlow
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: https://taskflow.example.com
  LOG_CHANNEL: stderr
  LOG_LEVEL: warning
  DB_CONNECTION: mysql
  DB_HOST: REPLACE_WITH_RDS_ENDPOINT   # terraform output rds_endpoint
  DB_PORT: "3306"
  DB_DATABASE: taskflow
  QUEUE_CONNECTION: database
  CACHE_STORE: database
  SESSION_DRIVER: database
  CORS_ALLOWED_ORIGINS: https://taskflow.example.com
  TRUSTED_PROXIES: 10.20.0.0/16        # CIDR du VPC (ALB)
  SANCTUM_EXPIRATION_MINUTES: "480"
