# ─── Environnement de PRODUCTION (instance EC2) ───────────────
# Déployé par scripts/deploy.sh. Variables fournies par /opt/taskflow/.env
# (généré depuis SSM Parameter Store) : ECR_REGISTRY, IMAGE_TAG, DB_*, APP_KEY…
name: taskflow

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80"]                       # reçoit le trafic de l'ALB uniquement (security group)
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [backend, frontend]
    logging: *logging
    networks: [app-network]
    deploy: { resources: { limits: { memory: 128m } } }

  frontend:
    image: ${ECR_REGISTRY}/taskflow-frontend:${IMAGE_TAG}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    networks: [app-network]

  backend:
    image: ${ECR_REGISTRY}/taskflow-backend:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      APP_NAME: TaskFlow
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      CORS_ALLOWED_ORIGINS: ${APP_URL}
      RUN_MIGRATIONS: "true"
      RUN_SEEDER: ${RUN_SEEDER:-false}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    depends_on:
      mysql: { condition: service_healthy }
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    networks: [app-network]

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - /data/mysql:/var/lib/mysql         # volume EBS chiffré + snapshots quotidiens (DLM)
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *logging
    networks: [app-network]                 # aucun port publié

  # ── Monitoring (accessible uniquement via SSM port-forward) ──
  prometheus:
    image: prom/prometheus:v3.0.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - /data/prometheus:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    logging: *logging
    networks: [app-network]

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - /data/grafana:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]
    user: "472"
    logging: *logging
    networks: [app-network]

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    command: [--path.rootfs=/host]
    pid: host
    volumes: ["/:/host:ro,rslave"]
    networks: [app-network]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [app-network]

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.16.0
    restart: unless-stopped
    command: [--mysqld.address=mysql:3306, --mysqld.username=root]
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${DB_ROOT_PASSWORD}
    depends_on:
      mysql: { condition: service_healthy }
    networks: [app-network]

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    restart: unless-stopped
    command: [--nginx.scrape-uri=http://nginx:8081/stub_status]
    depends_on: [nginx]
    networks: [app-network]

networks:
  app-network:
