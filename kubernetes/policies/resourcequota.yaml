apiVersion: v1
kind: ResourceQuota
metadata: {name: taskflow-quota, namespace: taskflow}
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 6Gi
    limits.cpu: "8"
    limits.memory: 12Gi
    pods: "40"
---
apiVersion: v1
kind: LimitRange
metadata: {name: taskflow-defaults, namespace: taskflow}
spec:
  limits:
    - type: Container
      default: {cpu: 250m, memory: 256Mi}
      defaultRequest: {cpu: 50m, memory: 64Mi}
