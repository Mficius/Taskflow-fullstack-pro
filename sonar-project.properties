sonar.projectKey=taskflow-fullstack-pro
sonar.projectName=TaskFlow Full Stack Pro
sonar.organization=mficius
sonar.sourceEncoding=UTF-8

sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests,frontend/src/__tests__

# Exclure les fichiers de test de l'analyse des sources principales
sonar.exclusions=**/vendor/**,**/node_modules/**,**/dist/**,**/coverage/**,frontend/src/__tests__/**,**/*.test.js,**/*.test.jsx

sonar.php.coverage.reportPaths=backend/coverage.xml

sonar.branch.name=main