# Pile éphémère pour le DAST en CI : MÊMES images que la production (backend, frontend, passerelle nginx),
# APP_ENV=production. nginx/ci.conf.template est généré par le workflow (template de prod sans rate-limit,
# pour ne pas fausser le scan).
name: taskflow-ci
services:
  nginx:
    build: { context: ./nginx }
    environment:
      BACKEND_HOST: backend
      FRONTEND_HOST: frontend
      LISTEN_PORT: "8000"
    ports: ["8080:8000"]
    volumes: ["./nginx/ci.conf.template:/etc/nginx/templates/default.conf.template:ro"]
    depends_on: [backend, frontend]
  frontend:
    build: { context: ./frontend }
  backend:
    build: { context: ./backend }
    environment:
      APP_NAME: TaskFlow
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: http://localhost:8080
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_DATABASE: taskflow
      DB_USERNAME: taskflow
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      CORS_ALLOWED_ORIGINS: http://localhost:8080
      RUN_MIGRATIONS: "true"
      RUN_SEEDER: "true"
      SEED_ADMIN_EMAIL: ${DAST_USER}
      SEED_ADMIN_PASSWORD: ${DAST_PASSWORD}
    depends_on:
      mysql: { condition: service_healthy }
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: taskflow
      MYSQL_USER: taskflow
      MYSQL_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20
