apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: taskflow-api-secrets
  namespace: taskflow
  labels: {app.kubernetes.io/name: taskflow-api, app.kubernetes.io/part-of: taskflow}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: taskflow-api-secrets
    creationPolicy: Owner
  data:
    - secretKey: APP_KEY
      remoteRef:
        key: taskflow/prod/laravel          # terraform output app_secret_name
        property: APP_KEY
    - secretKey: DB_USERNAME
      remoteRef:
        key: REPLACE_WITH_RDS_MASTER_SECRET_ARN  # terraform output rds_master_secret_arn
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: REPLACE_WITH_RDS_MASTER_SECRET_ARN
        property: password
