# Stack "prod-like" ÉPHÉMÈRE pour les tests dynamiques (DAST / OWASP ZAP) en CI.
# Utilise les images de PRODUCTION (php-fpm non-root, nginx-unprivileged) et
# une base jetable. NE JAMAIS pointer ZAP en scan actif sur la production.
#   docker compose -f docker-compose.dast.yml up -d --build --wait
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_DATABASE: taskflow
      MYSQL_USER: taskflow
      MYSQL_PASSWORD: dast-ci-password
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [dast]

  api: &api
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment: &api-env
      APP_NAME: TaskFlow
      APP_ENV: staging          # != production : permet le seed de démonstration
      APP_DEBUG: "false"
      APP_KEY: ""
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_DATABASE: taskflow
      DB_USERNAME: taskflow
      DB_PASSWORD: dast-ci-password
      MYSQL_ATTR_SSL_CA: ""     # pas de TLS vers la base éphémère
      CORS_ALLOWED_ORIGINS: http://localhost:8080
      LOG_CHANNEL: stderr
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [dast]

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["php", "artisan", "migrate", "--force", "--seed"]
    environment: *api-env
    depends_on:
      db:
        condition: service_healthy
    networks: [dast]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    networks: [dast]

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - frontend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/up"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [dast]

networks:
  dast:
