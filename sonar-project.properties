sonar.projectKey=taskflow_key
sonar.organization=mficius
# L'URL du serveur est fournie par la CI (SONAR_HOST_URL : https://sonarcloud.io ou votre SonarQube).

sonar.sources=backend/app,backend/routes,backend/database,frontend/src
sonar.tests=backend/tests,frontend/src/__tests__
sonar.test.inclusions=backend/tests/**,frontend/src/__tests__/**
sonar.exclusions=**/node_modules/**,**/vendor/**,**/build/**,**/dist/**,backend/storage/**,backend/bootstrap/cache/**

sonar.sourceEncoding=UTF-8

# Couverture
sonar.php.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
