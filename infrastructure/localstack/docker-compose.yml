# AWS simulé en local pour tester le Terraform AVANT de toucher un vrai compte.
# Les services de base (EC2/VPC, IAM, SSM, SNS, CloudWatch, Logs, S3) sont dans l'édition gratuite ;
# ECS, RDS, ELBv2, ECR et Application Auto Scaling nécessitent, à notre connaissance, un LOCALSTACK_AUTH_TOKEN (édition payante/essai).
# Image non épinglée volontairement à un tag ici : épinglez-la (digest) avant un usage en entreprise.
services:
  localstack:
    image: localstack/localstack:latest
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
      DEBUG: "0"
      DEFAULT_REGION: eu-west-3
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 30
