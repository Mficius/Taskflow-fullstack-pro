apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "taskflow.fullname" . }}-api-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "taskflow.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ include "taskflow.fullname" . }}-api
data:
  {{- range $k, $v := .Values.api.config }}
  {{- if not (and $.Values.mysql.enabled (eq $k "DB_HOST")) }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.mysql.enabled }}
  DB_HOST: {{ include "taskflow.fullname" . }}-mysql
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "taskflow.fullname" . }}-api-nginx
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "taskflow.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ include "taskflow.fullname" . }}-api
data:
  default.conf: |
    server {
        listen 8080;
        server_name _;
        server_tokens off;
        client_max_body_size 8m;

        location ~ ^/(api(/|$)|up$) {
            include fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
            fastcgi_param SCRIPT_NAME     /index.php;
            fastcgi_param DOCUMENT_ROOT   /var/www/html/public;
            fastcgi_param REQUEST_URI     $request_uri;
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
            fastcgi_read_timeout 30s;
        }

        location / {
            return 404;
        }
    }
