openapi: 3.0.3
info:
  title: TaskFlow API
  version: "1.0"
  description: Spécification de l'API (utilisée aussi par le scan DAST OWASP ZAP).
servers:
  - url: http://localhost:8080/api
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  schemas:
    Login:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: dast@taskflow.test }
        password: { type: string, example: placeholder-password }
    Task:
      type: object
      required: [title, projectId]
      properties:
        title: { type: string, maxLength: 255, example: Tâche de test }
        description: { type: string, nullable: true, maxLength: 10000 }
        status: { type: string, enum: [todo, in_progress, done] }
        priority: { type: string, enum: [low, medium, high] }
        dueDate: { type: string, format: date, nullable: true }
        projectId: { type: integer, example: 1 }
        assigneeId: { type: integer, nullable: true }
        completed: { type: boolean }
    Project:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 150, example: Projet de test }
        description: { type: string, nullable: true, maxLength: 5000 }
    Comment:
      type: object
      properties:
        body: { type: string, example: Commentaire de test }
  parameters:
    id:
      name: id
      in: path
      required: true
      schema: { type: integer, example: 1 }
  responses:
    Ok: { description: OK }
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Login" } } }
      responses: { "200": { $ref: "#/components/responses/Ok" }, "422": { description: Identifiants invalides }, "429": { description: Trop de tentatives } }
  /auth/me:
    get: { responses: { "200": { $ref: "#/components/responses/Ok" } } }
  /auth/logout:
    post: { responses: { "200": { $ref: "#/components/responses/Ok" } } }
  /todos:
    get: { responses: { "200": { $ref: "#/components/responses/Ok" } } }
    post:
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Task" } } }
      responses: { "201": { description: Créée }, "422": { description: Invalide } }
  /todos/{id}:
    parameters: [ { $ref: "#/components/parameters/id" } ]
    get: { responses: { "200": { $ref: "#/components/responses/Ok" }, "404": { description: Introuvable } } }
    put:
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/Task" } } }
      responses: { "200": { $ref: "#/components/responses/Ok" }, "404": { description: Introuvable } }
    delete: { responses: { "200": { $ref: "#/components/responses/Ok" }, "204": { description: Supprimée }, "404": { description: Introuvable } } }
  /todos/{id}/comments:
    parameters: [ { $ref: "#/components/parameters/id" } ]
    get: { responses: { "200": { $ref: "#/components/responses/Ok" } } }
    post:
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/Comment" } } }
      responses: { "201": { description: Créé }, "422": { description: Invalide } }
  /projects:
    get: { responses: { "200": { $ref: "#/components/responses/Ok" } } }
    post:
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } }
      responses: { "201": { description: Créé }, "403": { description: Interdit } }
  /projects/{id}:
    parameters: [ { $ref: "#/components/parameters/id" } ]
    get: { responses: { "200": { $ref: "#/components/responses/Ok" }, "404": { description: Introuvable } } }
  /dashboard:
    get: { responses: { "200": { $ref: "#/components/responses/Ok" } } }
  /analytics:
    get: { responses: { "200": { $ref: "#/components/responses/Ok" } } }
  /search:
    get:
      parameters: [ { name: q, in: query, schema: { type: string, example: test } } ]
      responses: { "200": { $ref: "#/components/responses/Ok" } }
  /notifications:
    get: { responses: { "200": { $ref: "#/components/responses/Ok" } } }
  /notifications/unread-count:
    get: { responses: { "200": { $ref: "#/components/responses/Ok" } } }
  /saved-views:
    get: { responses: { "200": { $ref: "#/components/responses/Ok" } } }
  /activity:
    get: { responses: { "200": { $ref: "#/components/responses/Ok" } } }
  /audit-log:
    get: { responses: { "200": { $ref: "#/components/responses/Ok" } } }
  /users:
    get: { responses: { "200": { $ref: "#/components/responses/Ok" } } }
