# External Secrets Operator (installé séparément) : lit AWS Secrets Manager avec
# le rôle IRSA du contrôleur (terraform: aws_iam_role.irsa["external-secrets"]).
# Aucun secret n'est stocké dans Git.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: taskflow
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-west-3
