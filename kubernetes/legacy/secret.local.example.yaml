# DÉVELOPPEMENT LOCAL UNIQUEMENT (kind / minikube) - ne jamais utiliser en production.
# Copier en secret.local.yaml (ignoré par git) et remplacer les valeurs :
#   APP_KEY : php artisan key:generate --show
apiVersion: v1
kind: Secret
metadata:
  name: taskflow-api-secrets
  namespace: taskflow
type: Opaque
stringData:
  APP_KEY: "base64:REPLACE_ME"
  DB_USERNAME: taskflow
  DB_PASSWORD: REPLACE_ME
