{{- range $n := list "api" "frontend" "migrate" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "taskflow.fullname" $ }}-{{ $n }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "taskflow.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ include "taskflow.fullname" $ }}-{{ $n }}
  {{- if and (eq $n "api") $.Values.serviceAccount.apiRoleArn }}
  annotations:
    eks.amazonaws.com/role-arn: {{ $.Values.serviceAccount.apiRoleArn | quote }}
  {{- end }}
automountServiceAccountToken: false
---
{{- end }}
