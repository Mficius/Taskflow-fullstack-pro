name: Infra - Security, Validation & Terraform

on:
  pull_request:
    branches: [main]
    paths:
      - "infrastructure/**"
      - "helm/**"
      - "policy/**"
      - ".github/workflows/infra.yaml"
  push:
    branches: [main]
    paths:
      - "infrastructure/**"
      - "helm/**"
      - "policy/**"
      - ".github/workflows/infra.yaml"
  workflow_dispatch:

# Least privilege by default. AWS OIDC permission is granted only to jobs that need it.
permissions:
  contents: read

concurrency:
  group: terraform-production-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-3' }}
  TF_VERSION: "1.10.5"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  # ---------------------------------------------------------------------------
  # 1. IaC security scans - no AWS credentials
  # ---------------------------------------------------------------------------
  iac-security:
    name: IaC Security - Checkov & Trivy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkov - Terraform scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infrastructure/terraform
          quiet: true
          soft_fail: false

      - name: Trivy - filesystem misconfiguration scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig
          severity: CRITICAL,HIGH
          exit-code: "1"

  # ---------------------------------------------------------------------------
  # 2. Helm rendering and OPA policy tests - no AWS credentials
  # ---------------------------------------------------------------------------
  helm-and-opa:
    name: Helm - Lint, Render & OPA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Lint production chart
        run: helm lint helm/taskflow -f helm/taskflow/values-eks.yaml

      - name: Render production manifests
        run: |
          helm template taskflow-production helm/taskflow \
            --namespace taskflow \
            -f helm/taskflow/values-eks.yaml \
            > "$RUNNER_TEMP/taskflow-rendered.yaml"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install Conftest
        run: |
          go install github.com/open-policy-agent/conftest@v0.62.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Verify OPA policy tests
        run: |
          conftest verify --policy policy/terraform
          conftest verify --policy policy/kubernetes

      - name: Enforce Kubernetes policies on rendered manifests
        run: conftest test --policy policy/kubernetes "$RUNNER_TEMP/taskflow-rendered.yaml"

  # ---------------------------------------------------------------------------
  # 3. Terraform static validation - no AWS credentials or remote state access
  # ---------------------------------------------------------------------------
  terraform-validate:
    name: Terraform - Format & Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Check formatting
        run: terraform fmt -check -diff -recursive

      - name: Initialize without remote backend
        run: terraform init -backend=false -input=false

      - name: Validate configuration
        run: terraform validate

  # ---------------------------------------------------------------------------
  # 4. Production plan - runs only after a change reaches main.
  #    PRs intentionally do not receive AWS credentials.
  # ---------------------------------------------------------------------------
  terraform-plan:
    name: Terraform - Production Plan
    needs: [iac-security, helm-and-opa, terraform-validate]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: terraform-plan
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infrastructure/terraform
    env:
      TF_VAR_github_repository: ${{ github.repository }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION || 'eu-west-3' }}
      TF_VAR_single_nat_gateway: ${{ vars.SINGLE_NAT_GATEWAY || 'false' }}
      TF_VAR_db_multi_az: ${{ vars.DB_MULTI_AZ || 'true' }}
      TF_VAR_acm_certificate_arn: ${{ vars.ACM_CERTIFICATE_ARN }}
      TF_VAR_eks_public_access_cidrs: ${{ vars.EKS_PUBLIC_ACCESS_CIDRS }}
      TF_VAR_tfstate_bucket_arn: ${{ vars.TF_STATE_BUCKET_ARN }}
      TF_VAR_tfstate_lock_table_arn: ${{ vars.TF_STATE_LOCK_TABLE_ARN }}
      TF_VAR_tfstate_kms_key_arn: ${{ vars.TF_STATE_KMS_KEY_ARN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install Conftest
        run: |
          go install github.com/open-policy-agent/conftest@v0.62.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Configure AWS credentials - Plan role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TF_PLAN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-3' }}

      - name: Configure remote state backend
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_LOCK_TABLE: ${{ vars.TF_STATE_LOCK_TABLE }}
          TF_STATE_KMS_KEY_ID: ${{ vars.TF_STATE_KMS_KEY_ID }}
        run: |
          set -euo pipefail
          test -n "$TF_STATE_BUCKET"
          test -n "$TF_STATE_LOCK_TABLE"
          test -n "$TF_STATE_KMS_KEY_ID"

          cat > backend.hcl <<EOF
          bucket         = "$TF_STATE_BUCKET"
          key            = "taskflow/prod/terraform.tfstate"
          region         = "$AWS_REGION"
          encrypt        = true
          kms_key_id     = "$TF_STATE_KMS_KEY_ID"
          dynamodb_table = "$TF_STATE_LOCK_TABLE"
          EOF

      - name: Terraform init
        run: terraform init -input=false -backend-config=backend.hcl

      - name: Create saved Terraform plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Convert plan to JSON for policy evaluation
        run: terraform show -json tfplan > tfplan.json

      - name: Enforce Terraform OPA policies
        run: conftest test --policy ../../policy/terraform tfplan.json

      - name: Upload reviewed Terraform plan
        uses: actions/upload-artifact@v4
        with:
          name: taskflow-production-tfplan
          path: infrastructure/terraform/tfplan
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # 5. Apply - protected by GitHub Environment required reviewers.
  #    Applies the exact plan generated and policy-checked above.
  # ---------------------------------------------------------------------------
  terraform-apply:
    name: Terraform - Production Apply
    needs: [terraform-plan]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production-infra
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infrastructure/terraform
    env:
      TF_VAR_github_repository: ${{ github.repository }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION || 'eu-west-3' }}
      TF_VAR_single_nat_gateway: ${{ vars.SINGLE_NAT_GATEWAY || 'false' }}
      TF_VAR_db_multi_az: ${{ vars.DB_MULTI_AZ || 'true' }}
      TF_VAR_acm_certificate_arn: ${{ vars.ACM_CERTIFICATE_ARN }}
      TF_VAR_eks_public_access_cidrs: ${{ vars.EKS_PUBLIC_ACCESS_CIDRS }}
      TF_VAR_tfstate_bucket_arn: ${{ vars.TF_STATE_BUCKET_ARN }}
      TF_VAR_tfstate_lock_table_arn: ${{ vars.TF_STATE_LOCK_TABLE_ARN }}
      TF_VAR_tfstate_kms_key_arn: ${{ vars.TF_STATE_KMS_KEY_ARN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials - Apply role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TF_APPLY }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-3' }}

      - name: Configure remote state backend
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_LOCK_TABLE: ${{ vars.TF_STATE_LOCK_TABLE }}
          TF_STATE_KMS_KEY_ID: ${{ vars.TF_STATE_KMS_KEY_ID }}
        run: |
          set -euo pipefail
          test -n "$TF_STATE_BUCKET"
          test -n "$TF_STATE_LOCK_TABLE"
          test -n "$TF_STATE_KMS_KEY_ID"

          cat > backend.hcl <<EOF
          bucket         = "$TF_STATE_BUCKET"
          key            = "taskflow/prod/terraform.tfstate"
          region         = "$AWS_REGION"
          encrypt        = true
          kms_key_id     = "$TF_STATE_KMS_KEY_ID"
          dynamodb_table = "$TF_STATE_LOCK_TABLE"
          EOF

      - name: Terraform init
        run: terraform init -input=false -backend-config=backend.hcl

      - name: Download approved Terraform plan
        uses: actions/download-artifact@v4
        with:
          name: taskflow-production-tfplan
          path: infrastructure/terraform

      - name: Apply the exact reviewed plan
        run: terraform apply -input=false -auto-approve tfplan
