{{- if .Values.secrets.local.enabled }}
{{- /* DEV LOCAL uniquement. En production : secrets.external.enabled=true */ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "taskflow.labels" . | nindent 4 }}
type: Opaque
stringData:
  APP_KEY: {{ required "secrets.local.appKey est requis (php artisan key:generate --show)" .Values.secrets.local.appKey | quote }}
  DB_USERNAME: {{ .Values.secrets.local.dbUsername | quote }}
  DB_PASSWORD: {{ required "secrets.local.dbPassword est requis" .Values.secrets.local.dbPassword | quote }}
{{- end }}
