name: CI - App Tests, Security & Docker Hub

on:
  push:
    branches: [main]
    paths-ignore:
      - 'infrastructure/**'
      - 'helm/**'
      - 'policy/**'
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'infrastructure/**'
      - 'helm/**'
      - 'policy/**'
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taskflow-app-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend - Laravel tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, pcntl, exif
          coverage: xdebug

      - name: Get Composer cache directory
        id: composer-cache
        working-directory: backend
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        working-directory: backend
        run: composer install --no-progress --prefer-dist --no-interaction

      - name: Prepare Laravel environment
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Laravel tests
        working-directory: backend
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan test --coverage-clover=coverage.xml

      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore
          retention-days: 7

  frontend-tests:
    name: Frontend - Tests & production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  quality-security:
    name: Quality & App Security analysis
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan - Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Filesystem and dependency scan - Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: SAST - Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: p/owasp-top-ten

      - name: SCA - Snyk backend
        if: ${{ env.SNYK_TOKEN != '' }}
        uses: snyk/actions/php@ce71ff9eda12bc48837b2855bca31364cdfa93e2
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: --severity-threshold=high --file=backend/composer.lock

      - name: SCA - Snyk frontend
        if: ${{ env.SNYK_TOKEN != '' }}
        uses: snyk/actions/node@ce71ff9eda12bc48837b2855bca31364cdfa93e2
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: --severity-threshold=high --file=frontend/package-lock.json

      - name: Download backend coverage for SonarQube
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: backend

      - name: SonarQube analysis
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  build-and-push:
    name: Docker - Build, scan & publish
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, quality-security]
    permissions:
      contents: read
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Docker Hub credentials
        env:
          USERNAME: ${{ secrets.DOCKER_USERNAME }}
          PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          test -n "$USERNAME" || { echo 'Secret DOCKER_USERNAME manquant'; exit 1; }
          test -n "$PASSWORD" || { echo 'Secret DOCKER_PASSWORD manquant'; exit 1; }

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.2

      - name: Build Laravel API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: ${{ secrets.DOCKER_USERNAME }}/laravel-api:${{ github.sha }}
          cache-from: type=gha,scope=taskflow-api
          cache-to: type=gha,mode=max,scope=taskflow-api

      - name: Scan Laravel API image - Trivy
        run: trivy image --exit-code 1 --ignore-unfixed --severity CRITICAL,HIGH "$IMAGE"
        env:
          IMAGE: ${{ secrets.DOCKER_USERNAME }}/laravel-api:${{ github.sha }}

      - name: Generate Laravel API SBOM
        run: trivy image --format cyclonedx --output sbom-api.cdx.json "$IMAGE"
        env:
          IMAGE: ${{ secrets.DOCKER_USERNAME }}/laravel-api:${{ github.sha }}

      - name: Build React frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: ${{ secrets.DOCKER_USERNAME }}/react-frontend:${{ github.sha }}
          cache-from: type=gha,scope=taskflow-frontend
          cache-to: type=gha,mode=max,scope=taskflow-frontend

      - name: Scan React frontend image - Trivy
        run: trivy image --exit-code 1 --ignore-unfixed --severity CRITICAL,HIGH "$IMAGE"
        env:
          IMAGE: ${{ secrets.DOCKER_USERNAME }}/react-frontend:${{ github.sha }}

      - name: Generate React frontend SBOM
        run: trivy image --format cyclonedx --output sbom-frontend.cdx.json "$IMAGE"
        env:
          IMAGE: ${{ secrets.DOCKER_USERNAME }}/react-frontend:${{ github.sha }}

      - name: Upload image SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: taskflow-image-sboms-${{ github.sha }}
          path: |
            sbom-api.cdx.json
            sbom-frontend.cdx.json
          retention-days: 30

      - name: Push Laravel API image
        env:
          IMAGE: ${{ secrets.DOCKER_USERNAME }}/laravel-api:${{ github.sha }}
        run: docker push "$IMAGE"

      - name: Push React frontend image
        env:
          IMAGE: ${{ secrets.DOCKER_USERNAME }}/react-frontend:${{ github.sha }}
        run: docker push "$IMAGE"
