name: CD - Build, Scan & Deploy ECS

on:
  workflow_run:
    workflows: ["CI - Tests, Security & Quality"]
    types: [completed]
    branches: [main]

  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag existant à redéployer (12 caractères du SHA). Vide = build du commit courant."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:

  # ====================================
  # 1. PREPARE
  # ====================================
  prepare:
    name: Prepare deployment
    runs-on: ubuntu-latest

    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push'
      )

    outputs:
      sha: ${{ steps.vars.outputs.sha }}
      tag: ${{ steps.vars.outputs.tag }}
      build: ${{ steps.vars.outputs.build }}

    steps:
      - name: Define deployment variables
        id: vars
        env:
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          CUR_SHA: ${{ github.sha }}
          INPUT_TAG: ${{ inputs.image_tag }}

        run: |
          if [ "$EVENT" = "workflow_run" ]; then
            SHA="$RUN_SHA"
          else
            SHA="$CUR_SHA"
          fi

          if [ -n "${INPUT_TAG:-}" ]; then
            [[ "$INPUT_TAG" =~ ^[0-9a-f]{12}$ ]] || {
              echo "::error::image_tag must contain 12 hexadecimal characters"
              exit 1
            }

            TAG="$INPUT_TAG"
            BUILD=false
          else
            TAG="${SHA:0:12}"
            BUILD=true
          fi

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"


  # ====================================
  # 2. BUILD, SCAN & PUSH TO ECR
  # ====================================
  build-push:
    name: Build & Push - ${{ matrix.service }}
    runs-on: ubuntu-latest

    needs: prepare

    if: needs.prepare.outputs.build == 'true'

    permissions:
      contents: read
      id-token: write

    strategy:
      matrix:
        service: [backend, frontend, nginx]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      # AWS authentication through OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-ecr-${{ github.run_id }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Avoid pushing an existing immutable tag
      - name: Check if image already exists
        id: exists
        env:
          REPO: taskflow-${{ matrix.service }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if aws ecr describe-images \
            --repository-name "$REPO" \
            --image-ids imageTag="$TAG" \
            >/dev/null 2>&1; then

            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Docker Buildx
        if: steps.exists.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v3

      # Build image
      - name: Build Docker image
        if: steps.exists.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: false
          load: true
          tags: ${{ steps.ecr.outputs.registry }}/taskflow-${{ matrix.service }}:${{ needs.prepare.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # Scan before pushing
      - name: Trivy image scan
        if: steps.exists.outputs.exists == 'false'
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.ecr.outputs.registry }}/taskflow-${{ matrix.service }}:${{ needs.prepare.outputs.tag }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      # Push image to ECR
      - name: Push image
        if: steps.exists.outputs.exists == 'false'
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/taskflow-${{ matrix.service }}:${{ needs.prepare.outputs.tag }}
        run: docker push "$IMAGE"


  # ====================================
  # 3. DEPLOY TO ECS FARGATE
  # ====================================
  deploy:
    name: Deploy to ECS Fargate
    runs-on: ubuntu-latest

    needs: [prepare, build-push]

    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      (
        needs.build-push.result == 'success' ||
        needs.build-push.result == 'skipped'
      )

    environment:
      name: production
      url: ${{ vars.APP_URL }}

    permissions:
      contents: read
      id-token: write

    env:
      TAG: ${{ needs.prepare.outputs.tag }}

      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}

      ECS_APP_FAMILY: ${{ vars.ECS_APP_FAMILY }}
      ECS_MIGRATE_FAMILY: ${{ vars.ECS_MIGRATE_FAMILY }}

      ECS_SUBNETS: ${{ vars.ECS_SUBNETS }}
      ECS_SECURITY_GROUP: ${{ vars.ECS_SECURITY_GROUP }}

      DESIRED_COUNT: ${{ vars.DESIRED_COUNT || '1' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-deploy-${{ github.run_id }}

      - name: Deploy application
        run: ./scripts/ecs-deploy.sh "$TAG"

      # Verify public application endpoint
      - name: Smoke test
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          for i in $(seq 1 20); do
            if curl -fsS -o /dev/null "$APP_URL/up"; then
              echo "Application is healthy"
              exit 0
            fi

            sleep 6
          done

          echo "::error::Application health check failed"
          exit 1

      # Deployment summary
      - name: Deployment summary
        if: always()
        run: |
          {
            echo "## TaskFlow ECS Deployment"
            echo ""
            echo "- Image tag: $TAG"
            echo "- Commit: ${{ needs.prepare.outputs.sha }}"
            echo "- ECS Cluster: $ECS_CLUSTER"
            echo "- ECS Service: $ECS_SERVICE"
          } >> "$GITHUB_STEP_SUMMARY"