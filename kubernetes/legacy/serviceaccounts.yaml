# Un ServiceAccount par workload, sans token monté (aucun appel à l'API K8s requis).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: taskflow-api
  namespace: taskflow
  labels: {app.kubernetes.io/name: taskflow-api, app.kubernetes.io/part-of: taskflow}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: taskflow-frontend
  namespace: taskflow
  labels: {app.kubernetes.io/name: taskflow-frontend, app.kubernetes.io/part-of: taskflow}
automountServiceAccountToken: false
