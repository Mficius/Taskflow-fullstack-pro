groups:
  - name: taskflow
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Cible {{ $labels.job }} injoignable"

      - alert: HostHighCpu
        expr: 100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "CPU > 85 % depuis 10 min"

      - alert: HostLowMemory
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Mémoire utilisée > 90 %"

      - alert: DiskAlmostFull
        expr: (1 - node_filesystem_avail_bytes{fstype=~"xfs|ext4"} / node_filesystem_size_bytes{fstype=~"xfs|ext4"}) * 100 > 85
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Disque {{ $labels.mountpoint }} rempli à plus de 85 %"

      - alert: MysqlDown
        expr: mysql_up == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "MySQL ne répond plus"

      - alert: MysqlTooManyConnections
        expr: mysql_global_status_threads_connected / mysql_global_variables_max_connections * 100 > 80
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Connexions MySQL > 80 % du maximum"

      - alert: ContainerRestarting
        expr: changes(container_start_time_seconds{name!=""}[15m]) > 2
        labels: { severity: warning }
        annotations:
          summary: "Le conteneur {{ $labels.name }} redémarre en boucle"
