name: CI - Tests, Security & Quality

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:

  # ====================================
  # 1. BACKEND TESTS
  # ====================================
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: xdebug

      - name: Install dependencies
        working-directory: backend
        run: composer install --no-progress --prefer-dist

      - name: Copy .env
        working-directory: backend
        run: cp .env.example .env

      - name: Generate application key
        working-directory: backend
        run: php artisan key:generate

      # - name: Run tests
      #   working-directory: backend
      #   run: php artisan test --coverage-clover=coverage.xml


      # - name: Upload coverage
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: backend-coverage
      #     path: backend/coverage.xml


  # ====================================
  # 2. FRONTEND TESTS
  # ====================================
  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # - name: Run tests
      #   working-directory: frontend
      #   run: npm test -- --coverage --watchAll=false

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage



  # ====================================
  # 3. SONARQUBE
  # ====================================
  sonar:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download coverage
        uses: actions/download-artifact@v4
        with:
          path: .

      - name: Run SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}



  # ====================================
  # 4. SAST
  # ====================================
  sast:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Snyk Backend Scan
        uses: snyk/actions/php@ce71ff9eda12bc48837b2855bca31364cdfa93e2
        #continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test backend/
          args: --severity-threshold=high

      - name: Snyk Frontend Scan 
        uses: snyk/actions/node@ce71ff9eda12bc48837b2855bca31364cdfa93e2
        #continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test frontend/
          args: --severity-threshold=high
