name: CD

# Déclenché quand la CI a réussi sur main, ou manuellement.
# Rollback en une étape : Actions → CD → Run workflow → image_tag = <tag précédent>.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag d'image EXISTANT à (re)déployer (12 caractères du SHA). Vide = build + déploiement du commit courant."
        required: false
        type: string

permissions:
  contents: read

# Un seul déploiement à la fois, jamais interrompu en cours de route.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  INSTANCE_NAME: taskflow-prod-app # tag Name de l'instance (cf. Terraform)

jobs:
  prepare:
    name: Préparation
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    outputs:
      sha: ${{ steps.vars.outputs.sha }}
      tag: ${{ steps.vars.outputs.tag }}
      build: ${{ steps.vars.outputs.build }}
    steps:
      - id: vars
        env:
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          CUR_SHA: ${{ github.sha }}
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          if [ "$EVENT" = "workflow_run" ]; then SHA="$RUN_SHA"; else SHA="$CUR_SHA"; fi
          if [ -n "${INPUT_TAG:-}" ]; then
            [[ "$INPUT_TAG" =~ ^[0-9a-f]{12}$ ]] || { echo "::error::image_tag invalide (12 caractères hexadécimaux attendus)"; exit 1; }
            TAG="$INPUT_TAG"; BUILD=false
          else
            TAG="${SHA:0:12}"; BUILD=true
          fi
          echo "sha=$SHA"     >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"     >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

  # ── Build, scan, push ECR (OIDC, rôle limité à ECR, branche main uniquement) ──
  build-push:
    name: Build & push (${{ matrix.service }})
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # requis pour l'OIDC — uniquement sur ce job
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.prepare.outputs.sha }}" }

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-ecr-${{ github.run_id }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: L'image existe-t-elle déjà ? (tags immuables)
        id: exists
        env:
          REPO: taskflow-${{ matrix.service }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if aws ecr describe-images --repository-name "$REPO" --image-ids imageTag="$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.exists.outputs.exists == 'false'

      - name: Build (local)
        if: steps.exists.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          load: true
          push: false
          tags: ${{ steps.ecr.outputs.registry }}/taskflow-${{ matrix.service }}:${{ needs.prepare.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Trivy — bloque si vulnérabilité CRITICAL/HIGH corrigeable
        if: steps.exists.outputs.exists == 'false'
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.ecr.outputs.registry }}/taskflow-${{ matrix.service }}:${{ needs.prepare.outputs.tag }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Push vers ECR
        if: steps.exists.outputs.exists == 'false'
        run: docker push "${{ steps.ecr.outputs.registry }}/taskflow-${{ matrix.service }}:${{ needs.prepare.outputs.tag }}"

  # ── Déploiement (OIDC, rôle limité à SSM + S3, environnement protégé) ──
  deploy:
    name: Déploiement production
    needs: [prepare, build-push]
    if: always() && needs.prepare.result == 'success' && (needs.build-push.result == 'success' || needs.build-push.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: production # ← ajoutez des « required reviewers » dans les réglages GitHub
      url: ${{ vars.APP_URL }}
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.prepare.outputs.sha }}" }

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-deploy-${{ github.run_id }}

      - name: Vérifier que les images existent dans ECR
        run: |
          for svc in backend frontend; do
            aws ecr describe-images --repository-name "taskflow-$svc" --image-ids imageTag="$TAG" >/dev/null \
              || { echo "::error::taskflow-$svc:$TAG introuvable dans ECR"; exit 1; }
          done

      - name: Créer et envoyer le bundle de déploiement
        run: |
          tar -czf bundle.tgz docker-compose.prod.yml nginx/prod.conf monitoring scripts/deploy.sh
          aws s3 cp bundle.tgz "s3://${{ vars.DEPLOY_BUCKET }}/bundles/${TAG}.tgz" --only-show-errors

      - name: Déployer via SSM (avec rollback automatique)
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=$INSTANCE_NAME" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          [ -n "$INSTANCE_ID" ] && [ "$INSTANCE_ID" != "None" ] || { echo "::error::Instance introuvable"; exit 1; }

          SCRIPT=$(cat <<SCRIPT_EOF
          set -euo pipefail
          set -a; . /etc/taskflow/instance.env; set +a
          aws s3 cp "s3://\$DEPLOY_BUCKET/bundles/${TAG}.tgz" /tmp/bundle.tgz --only-show-errors
          mkdir -p /opt/taskflow
          tar -xzf /tmp/bundle.tgz -C /opt/taskflow
          chmod +x /opt/taskflow/scripts/deploy.sh
          /opt/taskflow/scripts/deploy.sh "${TAG}"
          SCRIPT_EOF
          )
          jq -n --arg s "$SCRIPT" '{commands: [$s]}' > params.json

          CMD_ID=$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$INSTANCE_ID" \
            --parameters file://params.json \
            --timeout-seconds 900 \
            --comment "taskflow deploy ${TAG} (run ${{ github.run_id }})" \
            --query 'Command.CommandId' --output text)
          echo "Commande SSM : $CMD_ID sur $INSTANCE_ID"

          STATUS=Pending
          for _ in $(seq 1 120); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
          done

          echo "──────── sortie du déploiement ────────"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text || true
          [ "$STATUS" = "Success" ] || { echo "::error::Déploiement $STATUS (rollback automatique tenté)"; exit 1; }

      - name: Smoke test public
        run: |
          URL="${{ vars.APP_URL }}"
          for i in $(seq 1 20); do
            if curl -fsS -o /dev/null "$URL/up"; then echo "✔ $URL/up OK"; exit 0; fi
            sleep 6
          done
          echo "::error::$URL/up ne répond pas"; exit 1

      - name: Résumé
        if: always()
        run: |
          {
            echo "### Déploiement"
            echo "- Tag : \`$TAG\`"
            echo "- Commit : \`${{ needs.prepare.outputs.sha }}\`"
            echo "- Rollback : relancer ce workflow avec \`image_tag\` = tag précédent"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── DAST passif sur la production (aucune attaque active, aucun risque pour les données) ──
  dast-prod:
    name: ZAP baseline (production)
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ vars.APP_URL }}
          rules_file_name: .zap/rules.tsv
          allow_issue_writing: false
          artifact_name: zap-prod-baseline
          fail_action: false
