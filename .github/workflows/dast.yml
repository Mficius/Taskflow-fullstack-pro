name: DAST baseline
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'
permissions:
  contents: read
jobs:
  zap-baseline:
    runs-on: ubuntu-latest
    if: ${{ vars.APP_URL != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ vars.APP_URL }}
          cmd_options: '-a -m 5'
          fail_action: false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-baseline-report
          path: report_html.html
