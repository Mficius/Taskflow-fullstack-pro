name: CI - Tests, Security & Quality

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Permissions minimales : la CI n'accède pas à AWS.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ====================================
  # 1. BACKEND - LARAVEL
  # ====================================
  backend:
    name: Backend - PHP 8.4
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_sqlite, bcmath, pcntl
          coverage: pcov
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Validate Composer
        run: composer validate --strict --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Audit dependencies
        run: composer audit --locked

      - name: PHP syntax check
        run: |
          find app routes database config \
            -name '*.php' -print0 \
            | xargs -0 -n1 php -l > /dev/null

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests with coverage
        run: vendor/bin/phpunit --coverage-clover coverage.xml

      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: error


  # ====================================
  # 2. FRONTEND - REACT
  # ====================================
  frontend:
    name: Frontend - Node 24
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run tests with coverage
        run: npx vitest run --coverage

      - name: Build frontend
        run: npm run build

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          if-no-files-found: error


  # ====================================
  # 3. SECURITY - SECRETS + TRIVY
  # ====================================
  security:
    name: Security - Gitleaks & Trivy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Secrets committed into Git
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Dependency vulnerabilities
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # Terraform / Docker misconfigurations
      - name: Trivy configuration scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          severity: HIGH,CRITICAL
          exit-code: "0"


  # ====================================
  # 4. SONARQUBE
  # ====================================
  sonar:
    name: SonarQube - Code Quality
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: backend

      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage

      - name: SonarQube Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}

      - name: Skip SonarQube
        if: env.SONAR_TOKEN == ''
        run: echo "::notice::SONAR_TOKEN absent. SonarQube scan skipped."


  # ====================================
  # 5. INFRASTRUCTURE VALIDATION
  # ====================================
  infrastructure:
    name: Terraform - Validate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infrastructure/terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Terraform format
        run: terraform fmt -check -recursive -diff

      - name: Terraform init
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform validate


  # ====================================
  # 6. DOCKER COMPOSE + SCRIPTS
  # ====================================
  validation:
    name: Compose & Scripts Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate CI Docker Compose
        env:
          APP_KEY: ci
          DB_PASSWORD: p
          DAST_USER: u
          DAST_PASSWORD: p
        run: docker compose -f docker-compose.ci.yml config -q

      - name: Validate development Docker Compose
        run: |
          cp .env.example .env
          docker compose --profile monitoring config -q

      - name: Validate shell scripts
        run: |
          for f in scripts/*.sh; do
            bash -n "$f"
          done

          sh -n backend/docker/entrypoint.sh
          sh -n backend/docker/entrypoint.dev.sh
          sh -n infrastructure/localstack/run-tests.sh