{{- if .Values.secrets.external.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: {{ include "taskflow.fullname" . }}-aws
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "taskflow.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.secrets.external.region }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "taskflow.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ include "taskflow.fullname" . }}-aws
    kind: SecretStore
  target:
    name: {{ .Values.secrets.name }}
    creationPolicy: Owner
    template:
      metadata:
        labels:
          app.kubernetes.io/part-of: taskflow
        annotations:
          reloader.stakater.com/match: "true"
  data:
    - secretKey: APP_KEY
      remoteRef:
        key: {{ .Values.secrets.external.appSecretName }}
        property: APP_KEY
    - secretKey: DB_USERNAME
      remoteRef:
        key: {{ required "secrets.external.dbAppSecretArn est requis" .Values.secrets.external.dbAppSecretArn }}
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: {{ .Values.secrets.external.dbAppSecretArn }}
        property: password
    {{ if .Values.adminBootstrap.enabled }}
    - secretKey: ADMIN_EMAIL
      remoteRef:
        key: {{ .Values.secrets.external.appSecretName }}
        property: ADMIN_EMAIL
    - secretKey: ADMIN_PASSWORD
      remoteRef:
        key: {{ .Values.secrets.external.appSecretName }}
        property: ADMIN_PASSWORD
    {{ end }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.migrateName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "taskflow.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ include "taskflow.fullname" . }}-aws
    kind: SecretStore
  target:
    name: {{ .Values.secrets.migrateName }}
    creationPolicy: Owner
    template:
      metadata:
        labels:
          app.kubernetes.io/part-of: taskflow
        annotations:
          reloader.stakater.com/match: "true"
  data:
    - secretKey: DB_USERNAME
      remoteRef:
        key: {{ required "secrets.external.dbMigratorSecretArn est requis" .Values.secrets.external.dbMigratorSecretArn }}
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: {{ .Values.secrets.external.dbMigratorSecretArn }}
        property: password
{{- end }}
