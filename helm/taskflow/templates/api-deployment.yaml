{{- $fn := include "taskflow.fullname" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fn }}-api
  namespace: {{ .Release.Namespace }}
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    {{- include "taskflow.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ $fn }}-api
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $fn }}-api
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        checksum/config: {{ toYaml .Values.api.config | sha256sum }}
      labels:
        {{- include "taskflow.labels" . | nindent 8 }}
        app.kubernetes.io/name: {{ $fn }}-api
        app.kubernetes.io/component: api
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ $fn }}-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
        runAsUser: 82
        runAsGroup: 82
        fsGroup: 82
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $fn }}-api
      containers:
        - name: php-fpm
          image: {{ include "taskflow.image" (dict "root" . "repo" .Values.api.image.repository "digest" .Values.api.image.digest) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["php-fpm"]
          ports:
            - {name: fastcgi, containerPort: 9000}
          envFrom:
            {{- include "taskflow.apiEnvFrom" . | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          startupProbe:
            tcpSocket: {port: 9000}
            periodSeconds: 3
            failureThreshold: 30
          readinessProbe:
            tcpSocket: {port: 9000}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: 9000}
            periodSeconds: 15
          volumeMounts:
            {{- include "taskflow.laravelMounts" . | nindent 12 }}
        - name: nginx
          image: {{ .Values.api.nginx.image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - {name: http, containerPort: 8080}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
            runAsUser: 101
            runAsGroup: 101
          resources:
            {{- toYaml .Values.api.nginx.resources | nindent 12 }}
          readinessProbe:
            httpGet: {path: /up, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /up, port: http}
            periodSeconds: 20
          volumeMounts:
            - {name: nginx-conf, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf, readOnly: true}
            - {name: nginx-tmp, mountPath: /tmp}
      volumes:
        {{- include "taskflow.laravelVolumes" . | nindent 8 }}
        - {name: nginx-tmp, emptyDir: {sizeLimit: 32Mi}}
        - name: nginx-conf
          configMap:
            name: {{ $fn }}-api-nginx
