# ─── Environnement de DÉVELOPPEMENT ───────────────────────────
# Usage : make init && make up   → http://localhost:8080
services:
  backend:
    build: { context: ./backend, dockerfile: Dockerfile.dev }
    env_file: .env
    environment:
      DB_HOST: mysql
    volumes:
      - ./backend:/var/www/html
      - backend-vendor:/var/www/html/vendor
    depends_on:
      mysql: { condition: service_healthy }
    networks: [app-network]

  frontend:
    build: { context: ./frontend, dockerfile: Dockerfile.dev }
    environment:
      VITE_API_PROXY_TARGET: http://backend:80
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    networks: [app-network]

  nginx:
    image: nginx:1.27-alpine
    ports: ["127.0.0.1:8080:80"]
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [backend, frontend]
    networks: [app-network]

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    ports: ["127.0.0.1:3307:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [app-network]

  phpmyadmin:
    image: phpmyadmin:5
    profiles: ["tools"]          # docker compose --profile tools up
    environment: { PMA_HOST: mysql }
    ports: ["127.0.0.1:8081:80"]
    depends_on: [mysql]
    networks: [app-network]

  # ── Monitoring local : docker compose --profile monitoring up -d  →  Grafana http://localhost:3001 (admin/admin)
  prometheus:
    image: prom/prometheus:v3.0.1
    profiles: ["monitoring"]
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=3d]
    volumes: ["./monitoring/prometheus:/etc/prometheus:ro"]
    ports: ["127.0.0.1:9090:9090"]
    networks: [app-network]

  grafana:
    image: grafana/grafana:11.4.0
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3001:3000"]
    networks: [app-network]

  node-exporter:
    image: prom/node-exporter:v1.8.2
    profiles: ["monitoring"]
    networks: [app-network]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    profiles: ["monitoring"]
    volumes: ["/:/rootfs:ro", "/var/run:/var/run:ro", "/sys:/sys:ro", "/var/lib/docker/:/var/lib/docker:ro"]
    networks: [app-network]

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.16.0
    profiles: ["monitoring"]
    command: [--mysqld.address=mysql:3306, --mysqld.username=root]
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${DB_ROOT_PASSWORD}
    depends_on:
      mysql: { condition: service_healthy }
    networks: [app-network]

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    profiles: ["monitoring"]
    command: [--nginx.scrape-uri=http://nginx:8081/stub_status]
    depends_on: [nginx]
    networks: [app-network]

volumes:
  mysql-data:
  backend-vendor:
  frontend-node-modules:

networks:
  app-network:
