# Zero-trust réseau : tout est interdit, puis on ouvre le strict nécessaire.
# (nécessite un CNI qui applique les NetworkPolicy : VPC CNI avec
#  ENABLE_NETWORK_POLICY=true sur EKS, ou Calico/Cilium)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny-all, namespace: taskflow}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-dns, namespace: taskflow}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
# L'ALB (IP du VPC) -> pods web sur 8080
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-alb-to-web, namespace: taskflow}
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/name, operator: In, values: [taskflow-api, taskflow-frontend]}
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock: {cidr: 10.20.0.0/16}
      ports:
        - {protocol: TCP, port: 8080}
---
# API et worker -> RDS MySQL (sous-réseaux base de données) uniquement
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-api-to-database, namespace: taskflow}
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/name, operator: In, values: [taskflow-api, taskflow-queue-worker, taskflow-migrate]}
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock: {cidr: 10.20.128.0/18}   # sous-réseaux DB (cidrsubnet(vpc,4,8..11))
      ports:
        - {protocol: TCP, port: 3306}
